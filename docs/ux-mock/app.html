<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>course2md · 全应用高保真 mock（居中单栏 IA · v2）</title>
<!--
  v2：owner 否决左侧栏五页布局，改为居中单栏（参考 ~/Documents/1.jpg）。
  URL 参数：?page=home|notes|reader|settings & state=… & scale=1|2 & from=generate
  scale 机制不变：1rem = 14px@scale1 / 28px@scale2。
  rem ↔ GPUI rems()：承载文字的结构尺寸；px ↔ GPUI px()：边框、padding、gap、圆角、图标。
-->
<style>
/* ================= 设计 token（v2 暖奶油语言） ================= */
:root {
  --canvas: #F6F2EB;          /* 暖奶油画布 */
  --surface: #FFFFFF;
  --cream-inset: #FBF7F0;     /* 白卡内的奶油嵌层（计划确认区） */
  --ink: #221F1C;             /* 黑墨正文（奶油底 ≈14.5:1） */
  --gray: #6E6558;            /* 辅助（奶油底 ≈5.1:1，白底 ≈5.7:1） */
  --faint: #8A8074;           /* 弱化/占位 */
  --hairline: #E7E0D2;        /* 画布上的分隔 */
  --card-line: #EDE8DD;       /* 白卡上的分隔 */
  --control-border: #8A7E68;  /* 控件边界（白底 ≈4.0:1，奶油底 ≈3.5:1） */
  /* 珊瑚红：装饰（大字/下划线/图形）用 accent；文字与可点击强调用 accent-strong */
  --accent: #D95D4E;          /* 装饰级（奶油底 3.3:1，仅大字/下划线） */
  --accent-strong: #C24A3C;   /* 文字/选中标记（白底·白字均 ≈4.8:1） */
  --accent-soft: #F9E9E5;     /* 选中行浅底 */
  /* 主按钮近黑胶囊（同参考图；珊瑚红只表「当前/品牌」语义） */
  --primary: #221F1C;         /* 白字 ≈14.5:1 */
  --primary-hover: #3A342E;
  --ok: #256B45;   --ok-bg: #E1F1E6;     /* ≈5.4:1 */
  --warn: #8A5410; --warn-bg: #FAF0DC;   /* ≈5.5:1 */
  --err: #B4231A;  --err-bg: #FCEDE9;    /* ≈5.9:1 */
  --progress: #6E5F4C; --progress-bg: #EFE9DD;  /* 进行中徽章（暖中性） */
  --progress-fill: #8A7E68;   /* 进度条填充（暖灰，不占 accent） */
  --mark: #FCEFC7; --mark-cur: #F7DC8E; --mark-cur-line: #E3C26A;
  --r-hero: 18px;  /* 大卡（输入盒） */
  --r-card: 12px;  /* 列表行/面板/输入框 */
  --r-sm: 6px;     /* chip/徽章内图/ts-chip */
  --sh-hero: 0 1px 2px rgba(60,50,40,.05), 0 16px 40px rgba(60,50,40,.08);
  --sh-pill: 0 1px 2px rgba(60,50,40,.12);
  --sh-pop: 0 12px 32px rgba(60,50,40,.16);
}
html { font-size: calc(14px * var(--scale, 1)); }
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--canvas); color: var(--ink);
  font-family: -apple-system, "PingFang SC", sans-serif;
  font-size: 1rem; line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
input { font: inherit; }

/* ================= 顶栏（居中栏对齐，无侧栏） ================= */
.topbar { padding: 12px 24px; }
.topbar-inner {
  max-width: 51.429rem; margin: 0 auto;
  display: flex; align-items: center; gap: 16px;
}
.logo { font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; }
.logo .num { color: var(--accent); }
.nav-tabs { flex: 1; display: flex; justify-content: center; gap: 24px; }
.nav-tab { padding: 6px 2px; color: var(--gray); position: relative; white-space: nowrap; }
.nav-tab.on { color: var(--ink); font-weight: 600; }
.nav-tab.on::after {
  content: ''; position: absolute; left: 0; right: 0; bottom: -1px;
  height: 2px; border-radius: 1px; background: var(--accent);
}
.gear-btn {
  width: 2.286rem; height: 2.286rem; border-radius: 999px; flex-shrink: 0;
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--gray); font-size: 15px;
}
.gear-btn:hover { background: rgba(34,31,28,.06); }
.gear-btn.on { color: var(--ink); background: #EDE7DA; }

/* ================= 居中单栏 ================= */
.content { max-width: 51.429rem; margin: 0 auto; padding: 24px; }
.content.narrow { max-width: 48.571rem; }  /* 设置 680 */

/* ================= 控件语法（v2：胶囊化，角色与 v1 相同） ================= */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 2.571rem; padding: 2px 16px; border-radius: 999px;
  border: 1px solid transparent; font-size: 1rem; flex-shrink: 0; white-space: nowrap;
}
.btn-primary { background: var(--primary); color: #fff; font-weight: 600; }
.btn-primary:hover { background: var(--primary-hover); }
.btn-outline { background: var(--surface); border-color: var(--control-border); }
.btn-quiet { color: var(--ink); padding-left: 12px; padding-right: 12px; }
.btn-quiet:hover { background: rgba(34,31,28,.05); }
.btn.compact { min-height: 2.286rem; padding: 2px 12px; }
.btn .arrow { font-weight: 400; }
.btn .caret { font-size: 0.857rem; opacity: .7; }
.icon-btn {
  width: 2rem; height: 2rem; min-height: 2rem; flex-shrink: 0; padding: 0;
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: 999px; color: var(--gray); font-size: 1rem;
}
.icon-btn:hover { background: rgba(34,31,28,.05); }

/* 胶囊分段控件：互斥选择（来源/视图/页签），选中 = 白胶囊+柔和影（参考图语言） */
.seg {
  display: inline-flex; background: #ECE6D9; border-radius: 999px;
  padding: 2px; gap: 2px; flex-shrink: 0; max-width: 100%;
}
.seg-btn {
  min-height: 2.286rem; padding: 2px 14px; border-radius: 999px;
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--gray); white-space: nowrap;
}
.seg-btn.selected { background: #fff; color: var(--ink); font-weight: 600; box-shadow: var(--sh-pill); }

/* 独立开关项（按文件夹/目录）：与 seg 明确区分 */
.toggle-btn {
  display: inline-flex; align-items: center; gap: 6px;
  min-height: 2.286rem; padding: 2px 12px; border-radius: 999px;
  border: 1px solid var(--control-border); background: var(--surface);
  flex-shrink: 0; white-space: nowrap;
}
.toggle-btn .tick { width: 14px; text-align: center; color: transparent; flex-shrink: 0; }
.toggle-btn.on { background: #EFE9DD; font-weight: 600; }
.toggle-btn.on .tick { color: var(--ink); }

/* 开关/单选/勾选：选中用 accent-strong（文字级对比度） */
.switch { width: 32px; height: 20px; border-radius: 999px; background: #D8D0BF; position: relative; flex-shrink: 0; margin-top: 2px; }
.switch::after {
  content: ''; position: absolute; left: 2px; top: 2px; width: 16px; height: 16px;
  border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.18);
}
.switch.on { background: var(--accent-strong); }
.switch.on::after { left: 14px; }
.switch.dim { opacity: .45; }
.check {
  width: 16px; height: 16px; border-radius: 5px; flex-shrink: 0; margin-top: 2px;
  border: 1px solid var(--control-border); background: var(--surface);
  display: inline-flex; align-items: center; justify-content: center;
  color: transparent; font-size: 12px;
}
.check.on { background: var(--accent-strong); border-color: var(--accent-strong); color: #fff; }
.radio { width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--control-border); background: var(--surface); flex-shrink: 0; position: relative; margin-top: 2px; }
.radio.on { border-color: var(--accent-strong); }
.radio.on::after { content: ''; position: absolute; inset: 3px; border-radius: 50%; background: var(--accent-strong); }

/* 状态徽章：胶囊 + 低饱和状态色 */
.badge {
  display: inline-flex; align-items: center; min-height: 20px; padding: 1px 10px;
  border-radius: 999px; font-size: 0.857rem; font-weight: 600;
  flex-shrink: 0; white-space: nowrap;
}
.badge.progress { background: var(--progress-bg); color: var(--progress); }
.badge.ok { background: var(--ok-bg); color: var(--ok); }
.badge.warn { background: var(--warn-bg); color: var(--warn); }
.badge.err { background: var(--err-bg); color: var(--err); }
.badge.neutral { background: #EFE9DD; color: var(--gray); }

/* 文件夹 chip：只在可改归属处出现 */
.chip {
  display: inline-flex; align-items: center; gap: 6px; height: 2rem;
  max-width: min(16rem, 100%); min-width: 0; padding: 0 10px;
  border-radius: 999px; border: 1px solid var(--card-line); background: var(--surface);
  color: var(--gray); flex: 0 1 auto;
}
.chip:hover { background: rgba(34,31,28,.04); }
.chip-icon { flex-shrink: 0; font-size: 13px; }
.chip-label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip-caret { flex-shrink: 0; font-size: 0.857rem; }

/* 输入与字段 */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field-label { font-size: 1rem; font-weight: 600; }
.field-label.small { font-size: 0.857rem; color: var(--gray); font-weight: 600; }
.field-desc { font-size: 0.857rem; color: var(--gray); }
.input, .select {
  width: 100%; min-height: 2.571rem; border: 1px solid var(--control-border);
  background: var(--surface); padding: 2px 12px;
  font-size: 1rem; color: var(--ink); display: flex; align-items: center;
}
.input { border-radius: var(--r-card); }
.input::placeholder { color: var(--faint); }
.select { border-radius: 999px; justify-content: space-between; gap: 8px; }
.select .val { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.select .chev { color: var(--gray); flex-shrink: 0; font-size: 0.857rem; }
.input.err { border-color: var(--err); }
.field-error { font-size: 0.857rem; color: var(--err); }
.input-row { display: flex; gap: 8px; align-items: center; }
.input-row .input, .input-row .field, .input-row .select { flex: 1; min-width: 0; }

/* 折叠入口 */
.disclosure { display: flex; align-items: center; gap: 8px; min-height: 2.286rem; color: var(--gray); font-size: 1rem; border-radius: 8px; }
.disclosure .disc-arrow { font-size: 0.857rem; width: 14px; text-align: center; flex-shrink: 0; }
.disclosure .disc-extra { font-size: 0.857rem; }

/* 提示块 */
.notice { border-radius: var(--r-card); padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.notice.warn { background: var(--warn-bg); }
.notice.neutral { background: #F1EBDF; }
.notice-title { font-weight: 600; }
.notice.warn .notice-title { color: var(--warn); }
.notice-body { font-size: 0.857rem; }
.notice-actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* 偏好行：名称+说明在左，开关尾部对齐，行至少 44px */
.pref-row { display: flex; align-items: flex-start; gap: 16px; min-height: 3.143rem; padding: 6px 0; }
.pref-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.pref-name { font-weight: 600; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.pref-desc { font-size: 0.857rem; color: var(--gray); }
.pref-row.dim .pref-name, .pref-row.dim .pref-desc { color: var(--faint); }
.check-row { display: flex; align-items: flex-start; gap: 8px; padding: 6px 0; }

/* ================= 通用布局件 ================= */
.page-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
.page-title { font-size: 1.286rem; font-weight: 600; }
.section-label { font-size: 0.857rem; color: var(--gray); font-weight: 600; margin-bottom: 8px; }
.back-row { display: flex; align-items: baseline; gap: 8px; margin-bottom: 12px; }
.back-hint { font-size: 0.857rem; color: var(--faint); }
.link-quiet { font-size: 0.857rem; color: var(--gray); text-decoration: underline; text-underline-offset: 2px; white-space: nowrap; }
.mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 0.857em; }

/* 合成封面：低饱和「课件帧」；无封面数据时整块省略 */
.art { position: relative; overflow: hidden; }
.art::before { content: ''; position: absolute; left: 9%; top: 15%; width: 46%; height: 11%; border-radius: 2px; background: var(--band, #B9C9E4); }
.art::after {
  content: ''; position: absolute; left: 9%; right: 9%; top: 35%; bottom: 16%;
  background: repeating-linear-gradient(to bottom, var(--lines, #C9D1DC) 0 5px, transparent 5px 12px);
}
.art-a { background: #EEF1F6; --band: #B9C9E4; --lines: #C9D1DC; }
.art-b { background: #F3EEE4; --band: #D9C4A8; --lines: #DBD2C0; }
.art-c { background: #ECF1EC; --band: #B8CDBB; --lines: #CBD5CC; }
.art-d { background: #323947; --band: #8EA3C8; --lines: #4D5769; }
.art-e { background: #EDE8DE; --band: #C3927F; --lines: #D3C9BC; }

/* ================= 工作台：hero + 大输入盒 + 最近笔记 ================= */
.hero { text-align: center; margin-top: 32px; margin-bottom: 24px; }
.wordmark { font-size: 3rem; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
.wordmark .num { color: var(--accent); }
.tagline { color: var(--gray); margin-top: 8px; }
.box {
  background: var(--surface); border-radius: var(--r-hero);
  box-shadow: var(--sh-hero); padding: 16px;
  display: flex; flex-direction: column; gap: 16px;
}
.box-mode { display: flex; justify-content: center; }
.box-input { position: relative; min-height: 6rem; padding: 4px; display: flex; }
.box-input .link-ic { color: var(--faint); flex-shrink: 0; padding: 4px 8px 0 4px; }
.box-input textarea, .box-input .input-static {
  flex: 1; min-width: 0; border: 0; outline: 0; background: transparent;
  font-size: 1rem; color: var(--ink); resize: none; line-height: 1.6; padding: 2px 0;
}
.box-input .input-static.ph { color: var(--faint); }
.platform-badges { position: absolute; top: 4px; right: 4px; display: flex; gap: 12px; }
.pb { display: inline-flex; align-items: center; gap: 5px; font-size: 0.857rem; color: var(--gray); white-space: nowrap; }
.pb-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.box-foot { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.box-foot .select { width: auto; flex: 0 1 auto; max-width: 16rem; }
.box-foot .spacer { flex: 1; }
.box-sec { border-top: 1px solid var(--card-line); padding-top: 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.reading-row { display: flex; align-items: center; gap: 8px; color: var(--gray); padding: 4px 0; }
.spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--hairline); border-top-color: var(--gray); flex-shrink: 0; }
.def-row { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.def-k { color: var(--gray); flex-shrink: 0; }
.def-v { font-weight: 600; min-width: 0; }

/* 所选视频行（盒内，无嵌套卡） */
.video-row { display: flex; gap: 12px; align-items: flex-start; }
.video-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.video-title { font-weight: 600; }
.video-meta { font-size: 0.857rem; color: var(--gray); }
.cover { width: 6.857rem; height: 3.857rem; border-radius: var(--r-sm); flex-shrink: 0; }

/* 分集/字幕单选面板 */
.ep-panel { border: 1px solid var(--card-line); border-radius: var(--r-card); background: var(--surface); overflow: hidden; }
.ep-head { padding: 8px 12px; font-size: 0.857rem; color: var(--gray); border-bottom: 1px solid var(--card-line); }
.ep-row { display: flex; align-items: center; gap: 12px; padding: 8px 12px; min-height: 2.286rem; }
.ep-row + .ep-row { border-top: 1px solid var(--card-line); }
.ep-row.selected { background: var(--accent-soft); }
.ep-num { color: var(--gray); font-size: 0.857rem; width: 28px; flex-shrink: 0; }
.ep-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ep-dur, .ep-tag { font-size: 0.857rem; color: var(--gray); flex-shrink: 0; white-space: nowrap; }
.panel-note { font-size: 0.857rem; color: var(--gray); }

/* 计划确认区：奶油嵌层，全盒视觉权重最高 */
.plan {
  background: var(--cream-inset); border: 1px solid var(--hairline);
  border-radius: var(--r-card); padding: 16px;
  display: flex; flex-direction: column; gap: 8px;
}
.plan-label { font-size: 0.857rem; color: var(--gray); font-weight: 600; }
.plan-row { display: flex; gap: 12px; }
.plan-k { width: 56px; flex-shrink: 0; color: var(--gray); font-size: 0.857rem; padding-top: 2px; }
.plan-v { flex: 1; min-width: 0; }
.plan-v .warn-text { color: var(--warn); font-weight: 600; }
.plan-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
.plan-note { font-size: 0.857rem; color: var(--gray); }

/* 盒内进度卡（running/failed 共用零件） */
.box-head { display: flex; align-items: flex-start; gap: 8px; min-width: 0; }
.box-head .badge { margin-top: 1px; }
.box-title { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-top: 1px; }
.box-meta { font-size: 0.857rem; color: var(--gray); }
.work-list { display: flex; flex-direction: column; gap: 12px; border-top: 1px solid var(--card-line); padding-top: 12px; }
.work-item { display: flex; flex-direction: column; gap: 6px; }
.work-line { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.work-name { font-weight: 600; flex-shrink: 0; }
.work-stats { font-size: 0.857rem; color: var(--gray); flex: 1; min-width: 8rem; }
.bar { height: 6px; border-radius: 999px; background: var(--progress-bg); overflow: hidden; }
.bar-fill { height: 100%; background: var(--progress-fill); border-radius: 999px; }
.milestone { font-size: 0.857rem; color: var(--gray); display: flex; gap: 6px; align-items: baseline; }
.milestone .mk { color: var(--ok); flex-shrink: 0; }
.box-actions { display: flex; gap: 8px; flex-wrap: wrap; border-top: 1px solid var(--card-line); padding-top: 12px; }
.err-text { color: var(--err); font-weight: 600; }

/* 最近笔记 */
.recent-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin: 32px 0 12px; }
.recent-title { font-size: 1.286rem; font-weight: 600; }
.recent-list { display: flex; flex-direction: column; gap: 8px; }
.rec-row {
  background: var(--surface); border: 1px solid var(--card-line);
  border-radius: var(--r-card); padding: 12px;
  display: flex; align-items: center; gap: 12px; min-width: 0;
}
.rec-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.rec-title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rec-meta { font-size: 0.857rem; color: var(--gray); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rec-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

/* ================= 我的笔记 ================= */
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 16px; }
.search {
  flex: 1; min-width: 10rem; display: flex; align-items: center; gap: 8px;
  background: var(--surface); border: 1px solid var(--control-border);
  border-radius: 999px; padding: 0 12px; min-height: 2.286rem;
}
.search-icon { color: var(--gray); font-size: 13px; flex-shrink: 0; }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 1rem; color: var(--ink); }
.search-clear { color: var(--gray); flex-shrink: 0; padding: 0 2px; }
.search-scope { display: flex; align-items: baseline; gap: 12px; font-size: 0.857rem; color: var(--gray); margin-bottom: 4px; flex-wrap: wrap; }
.group-block { margin-top: 20px; }
.group-block:first-child { margin-top: 0; }
.folder-group { display: flex; align-items: baseline; gap: 8px; width: 100%; padding: 4px 0; text-align: left; }
.fg-caret { color: var(--gray); flex-shrink: 0; font-size: 0.857rem; }
.fg-name { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fg-count { font-size: 0.857rem; color: var(--gray); flex-shrink: 0; }
.note-list { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
.note-title { font-weight: 600; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.note-meta { font-size: 0.857rem; color: var(--gray); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.note-grid { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 8px; }
.note-card {
  flex: 1 1 13rem; min-width: 13rem; max-width: 20rem;
  background: var(--surface); border: 1px solid var(--card-line);

  if (state === 'storage') {

/* ================= 初始化 ================= */
(function () {
  var q = new URLSearchParams(location.search);
  var scale = parseFloat(q.get('scale') || '1');
  if (!isFinite(scale) || scale <= 0) scale = 1;
  document.documentElement.style.setProperty('--scale', String(scale));
  var page = q.get('page') || 'home';
  var defaults = { home: 'empty', notes: 'list', reader: 'notes', settings: 'general' };
  var state = q.get('state') || defaults[page] || '';
  var from = q.get('from') || '';
  var main = document.getElementById('main');
  if (page === 'settings') {
    main.classList.add('narrow');
    main.innerHTML = renderSettings(state, from);
  } else {
    var renderers = { home: renderHome, notes: renderNotes, reader: renderReader };
    main.innerHTML = (renderers[page] || renderHome)(state);
  }
  /* 顶栏选中态：阅读归入我的笔记；设置无页签归属，齿轮亮起 */
  var navSel = page === 'reader' ? 'notes' : page;
  var tab = document.querySelector('.nav-tab[data-nav="' + navSel + '"]');
  if (tab) tab.classList.add('on');
  if (page === 'settings') document.querySelector('.gear-btn').classList.add('on');
  document.title = 'course2md mock v2 · ' + page + '/' + state;
})();
</script>
