<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>course2md · 全应用高保真 mock</title>
<!--
  course2md 桌面应用全页面 mock（GPUI 复刻蓝图）
  URL 参数：?page=library|generate|tasks|reader|settings & state=… & scale=1|2 & from=generate
  scale 模拟 GPUI 用户字号倍率：1rem = 14px@scale1 / 28px@scale2（机制同 index.html）。
  rem ↔ GPUI rems()：承载文字或随文字呼吸的结构尺寸（侧栏宽、控件高、栏宽、封面、字号）。
  px  ↔ GPUI px()：1px 边框、padding、gap、圆角、固定图标，永不缩放。
-->
<style>
/* ================= 设计 token ================= */
:root {
  /* 色板：ink/gray/control-border/accent 沿用实机验收过的对比度组合
     （#657184 白底 4.94:1；#315bc5 白字 6.12:1；#485363 白底 7.80:1） */
  --canvas: #F7F7F5;
  --surface: #FFFFFF;
  --sidebar: #ECEDF0;
  --sidebar-line: #DCDDE2;
  --ink: #252A32;
  --gray: #485363;
  --faint: #6A7383;
  --hairline: #E3E5E2;
  --control-border: #657184;
  --accent: #315BC5;
  --accent-hover: #2A4DAB;
  --accent-soft: #EAF0FF;
  --ok: #217A46;    --ok-bg: #E4F2E9;
  --warn: #8F5A0E;  --warn-bg: #FAF1DC;
  --err: #B4231A;   --err-bg: #FCEDE9;
  --neutral-bg: #ECEDEF;
  --progress-fill: #7A8699;   /* 新增：进度条填充（低饱和石板色，不占用 accent） */
  --mark: #FCEFC7;  --mark-cur: #F7DC8E;  --mark-cur-line: #E3C26A;
}
html { font-size: calc(14px * var(--scale, 1)); }
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--canvas); color: var(--ink);
  font-family: -apple-system, "PingFang SC", sans-serif;
  font-size: 1rem; line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

/* ================= 窗口框架 ================= */
.titlebar {
  height: 28px; flex-shrink: 0; display: flex; align-items: center;
  padding: 0 12px; position: relative; background: var(--canvas);
  border-bottom: 1px solid var(--hairline);
}
.tl-dots { display: flex; gap: 8px; }
.tl-dot { width: 12px; height: 12px; border-radius: 50%; }
.tl-title {
  position: absolute; left: 0; right: 0; text-align: center;
  font-size: 0.857rem; color: var(--faint); pointer-events: none;
}
.app { display: flex; min-height: calc(100vh - 28px); }

/* ================= 侧栏（200px = 14.286rem） ================= */
.sidebar {
  width: 14.286rem; flex-shrink: 0;
  background: var(--sidebar); border-right: 1px solid var(--sidebar-line);
  padding: 12px; display: flex; flex-direction: column; gap: 16px;
  position: sticky; top: 0; height: calc(100vh - 28px);
}
.main-nav { display: flex; flex-direction: column; gap: 2px; }
.nav-item {
  display: flex; align-items: center; gap: 8px;
  min-height: 2.286rem; padding: 2px 8px; border-radius: 6px;
  color: var(--ink);
}
.nav-item.selected { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav-icon { width: 20px; flex-shrink: 0; text-align: center; font-size: 15px; line-height: 1.4; }
.nav-label { min-width: 0; }
.nav-badge {
  margin-left: auto; flex-shrink: 0; min-width: 20px; height: 20px;
  padding: 0 6px; border-radius: 10px; background: var(--err); color: #fff;
  font-size: 0.857rem; font-weight: 600; display: inline-flex;
  align-items: center; justify-content: center;
}
.group-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 4px 0 8px;
}
.group-title { font-size: 0.857rem; color: var(--gray); }
.folder-list { display: flex; flex-direction: column; gap: 2px; }
.folder-item { display: flex; align-items: flex-start; gap: 8px; padding: 6px 8px; border-radius: 6px; }
.folder-icon { width: 18px; flex-shrink: 0; text-align: center; font-size: 14px; line-height: 1.45; }
.folder-name {
  flex: 1; min-width: 0; font-size: 0.857rem;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden; word-break: break-all;
}
.folder-count { font-size: 0.857rem; color: var(--gray); white-space: nowrap; flex-shrink: 0; }
.sidebar-bottom { margin-top: auto; }

/* ================= 通用控件（唯一语法，全站一致） ================= */
/* 主按钮：accent 填充。每页/每个独立区域最多一个 */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 2.571rem; padding: 2px 14px; border-radius: 6px;
  border: 1px solid transparent; font-size: 1rem; flex-shrink: 0;
}
.btn-primary { background: var(--accent); color: #fff; font-weight: 600; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-outline { background: var(--surface); border-color: var(--control-border); }
.btn-quiet { color: var(--ink); padding-left: 10px; padding-right: 10px; }
.btn-quiet:hover { background: rgba(37,42,50,.06); }
.btn.compact, .compact.btn { min-height: 2.286rem; padding: 2px 10px; }
.btn .caret { font-size: 0.857rem; color: inherit; opacity: .8; }
.icon-btn {
  width: 2rem; height: 2rem; min-height: 2rem; flex-shrink: 0; padding: 0;
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: 6px; color: var(--gray); font-size: 1rem;
}
.icon-btn:hover { background: rgba(37,42,50,.06); }

/* 分段控件：互斥选择（视图/来源/页签），选中 = 蓝底白字（沿设置复审约定） */
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--control-border); border-radius: 6px; overflow: hidden; flex-shrink: 0; max-width: 100%; }
.seg-btn {
  min-height: 2.571rem; padding: 2px 14px; display: inline-flex;
  align-items: center; justify-content: center; white-space: nowrap;
}
.seg-btn + .seg-btn { border-left: 1px solid var(--control-border); }
.seg-btn.selected { background: var(--accent); color: #fff; font-weight: 600; }
.seg.compact .seg-btn { min-height: 2.286rem; padding: 2px 12px; }

/* 独立开关按钮：开/关一个选项（按文件夹、目录），与分段控件明确区分 */
.toggle-btn {
  display: inline-flex; align-items: center; gap: 6px;
  min-height: 2.286rem; padding: 2px 10px; border-radius: 6px;
  border: 1px solid var(--control-border); background: var(--surface);
  flex-shrink: 0; white-space: nowrap;
}
.toggle-btn .tick { width: 14px; text-align: center; color: transparent; flex-shrink: 0; }
.toggle-btn.on { background: var(--neutral-bg); font-weight: 600; }
.toggle-btn.on .tick { color: var(--ink); }

/* 开关：尾部对齐，胶囊形为平台惯例（圆角 6 的组件例外） */
.switch { width: 32px; height: 20px; border-radius: 10px; background: #C6CAD1; position: relative; flex-shrink: 0; margin-top: 2px; }
.switch::after {
  content: ''; position: absolute; left: 2px; top: 2px; width: 16px; height: 16px;
  border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.2);
}
.switch.on { background: var(--accent); }
.switch.on::after { left: 14px; }
.switch.dim { opacity: .45; }

/* 勾选 / 单选：选中标记用 accent（选择语义，同「当前导航」） */
.check {
  width: 16px; height: 16px; border-radius: 4px; flex-shrink: 0; margin-top: 2px;
  border: 1px solid var(--control-border); background: var(--surface);
  display: inline-flex; align-items: center; justify-content: center;
  color: transparent; font-size: 12px;
}
.check.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.radio { width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--control-border); background: var(--surface); flex-shrink: 0; position: relative; margin-top: 2px; }
.radio.on { border-color: var(--accent); }
.radio.on::after { content: ''; position: absolute; inset: 3px; border-radius: 50%; background: var(--accent); }

/* 状态徽章：低饱和状态色各一；进行中用石板色，不占用 accent */
.badge {
  display: inline-flex; align-items: center; min-height: 20px; padding: 1px 8px;
  border-radius: 6px; font-size: 0.857rem; font-weight: 600;
  flex-shrink: 0; white-space: nowrap;
}
.badge.progress { background: #E8ECF2; color: #41506B; }
.badge.ok { background: var(--ok-bg); color: var(--ok); }
.badge.warn { background: var(--warn-bg); color: var(--warn); }
.badge.err { background: var(--err-bg); color: var(--err); }
.badge.neutral { background: var(--neutral-bg); color: var(--gray); }

/* 文件夹 chip：只在可改归属处出现，分组视图内不重复 */
.chip {
  display: inline-flex; align-items: center; gap: 6px; height: 2rem;
  max-width: min(16rem, 100%); min-width: 0; padding: 0 8px;
  border-radius: 6px; color: var(--gray); flex: 0 1 auto;
}
.chip:hover { background: rgba(37,42,50,.06); }
.chip-icon { flex-shrink: 0; font-size: 13px; }
.chip-label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip-caret { flex-shrink: 0; font-size: 0.857rem; }

/* 输入与字段 */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field-label { font-size: 1rem; font-weight: 600; }
.field-label.small { font-size: 0.857rem; color: var(--gray); font-weight: 600; }
.field-desc { font-size: 0.857rem; color: var(--gray); }
.input, .select {
  width: 100%; min-height: 2.571rem; border: 1px solid var(--control-border);
  border-radius: 6px; background: var(--surface); padding: 2px 12px;
  font-size: 1rem; color: var(--ink); display: flex; align-items: center;
}
.input::placeholder { color: var(--faint); }
.select { justify-content: space-between; gap: 8px; }
.select .val { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.select .chev { color: var(--gray); flex-shrink: 0; font-size: 0.857rem; }
.input.err { border-color: var(--err); }
.field-error { font-size: 0.857rem; color: var(--err); }
.input-row { display: flex; gap: 8px; align-items: center; }
.input-row .input, .input-row .field { flex: 1; min-width: 0; }

/* 折叠入口：技术详情 / 来源详情 / 同时导出文件 */
.disclosure { display: flex; align-items: center; gap: 8px; min-height: 2.286rem; color: var(--gray); font-size: 1rem; border-radius: 6px; }
.disclosure .disc-arrow { font-size: 0.857rem; width: 14px; text-align: center; flex-shrink: 0; }
.disclosure .disc-extra { font-size: 0.857rem; }

/* 卡片与提示 */
.card { background: var(--surface); border: 1px solid var(--hairline); border-radius: 6px; padding: 16px; }
.notice { border-radius: 6px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.notice.warn { background: var(--warn-bg); }
.notice.neutral { background: var(--neutral-bg); }
.notice-title { font-weight: 600; }
.notice.warn .notice-title { color: var(--warn); }
.notice-body { font-size: 0.857rem; }
.notice-actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* 偏好行：名称+说明在左，开关尾部对齐，行至少 44px（3.143rem） */
.pref-row { display: flex; align-items: flex-start; gap: 16px; min-height: 3.143rem; padding: 6px 0; }
.pref-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.pref-name { font-weight: 600; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.pref-desc { font-size: 0.857rem; color: var(--gray); }
.pref-row.dim .pref-name, .pref-row.dim .pref-desc { color: var(--faint); }
.check-row { display: flex; align-items: flex-start; gap: 8px; padding: 6px 0; }
.check-row .pref-main { gap: 0; }

/* ================= 页面骨架 ================= */
.main { flex: 1; min-width: 0; padding: 24px; }
.page-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
.page-title { font-size: 1.286rem; font-weight: 600; }
.page-note { font-size: 0.857rem; color: var(--gray); margin: -8px 0 16px; }
.col-form { max-width: 48.571rem; }  /* 680px@1x：表单/设置 */
.col-read { max-width: 51.429rem; }  /* 720px@1x：阅读 */
.section { margin-top: 24px; }
.section-label { font-size: 0.857rem; color: var(--gray); font-weight: 600; margin-bottom: 8px; }
.divider { height: 1px; background: var(--hairline); margin: 12px 0; }
.back-row { display: flex; align-items: baseline; gap: 8px; margin-bottom: 12px; }
.back-hint { font-size: 0.857rem; color: var(--faint); }
.link-quiet { font-size: 0.857rem; color: var(--gray); text-decoration: underline; text-underline-offset: 2px; white-space: nowrap; }

/* 合成封面：CSS 绘制的低饱和「课件/视频帧」，非占位色块；无封面数据时整块省略 */
.art { position: relative; overflow: hidden; }
.art::before { content: ''; position: absolute; left: 9%; top: 15%; width: 46%; height: 11%; border-radius: 2px; background: var(--band, #B9C9E4); }
.art::after {
  content: ''; position: absolute; left: 9%; right: 9%; top: 35%; bottom: 16%;
  background: repeating-linear-gradient(to bottom, var(--lines, #C9D1DC) 0 5px, transparent 5px 12px);
}
.art-a { background: #EEF1F6; --band: #B9C9E4; --lines: #C9D1DC; }
.art-b { background: #F3F0E9; --band: #DECFB2; --lines: #D9D2C3; }
.art-c { background: #ECF1EC; --band: #B8CDBB; --lines: #CBD5CC; }
.art-d { background: #323947; --band: #8EA3C8; --lines: #4D5769; }
.art-e { background: #DDDED9; --band: #ADB2B8; --lines: #C3C6C8; }

/* ================= 课程库 ================= */
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 16px; }
.search {
  flex: 1; min-width: 10rem; display: flex; align-items: center; gap: 8px;
  background: var(--surface); border: 1px solid var(--control-border);
  border-radius: 6px; padding: 0 12px; min-height: 2.286rem;
}
.search-icon { color: var(--gray); font-size: 13px; flex-shrink: 0; }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 1rem; color: var(--ink); }
.search-clear { color: var(--gray); flex-shrink: 0; padding: 0 2px; }
.search-scope { display: flex; align-items: baseline; gap: 12px; font-size: 0.857rem; color: var(--gray); margin-bottom: 4px; flex-wrap: wrap; }
.group-block { margin-top: 20px; }
.group-block:first-child { margin-top: 0; }
.folder-group { display: flex; align-items: baseline; gap: 8px; width: 100%; padding: 4px 0; text-align: left; }
.fg-caret { color: var(--gray); flex-shrink: 0; font-size: 0.857rem; }
.fg-name { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fg-count { font-size: 0.857rem; color: var(--gray); flex-shrink: 0; }
.note-list { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
.note-row {
  display: flex; align-items: center; gap: 12px; flex-wrap: nowrap;
  background: var(--surface); border: 1px solid var(--hairline);
  border-radius: 6px; padding: 12px; min-width: 0;
}
.cover { width: 6.857rem; height: 3.857rem; border-radius: 4px; flex-shrink: 0; }
.note-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.note-title { font-weight: 600; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.note-meta { font-size: 0.857rem; color: var(--gray); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.note-grid { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 8px; }
.note-card {
  flex: 1 1 13rem; min-width: 13rem; max-width: 20rem;
  background: var(--surface); border: 1px solid var(--hairline);
  border-radius: 6px; overflow: hidden; display: flex; flex-direction: column;
}
.card-cover { aspect-ratio: 16 / 9; }
.card-body { padding: 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.card-foot { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
.card-foot .chip { flex: 1; min-width: 0; max-width: none; }
.empty-block { margin-top: 32px; display: flex; flex-direction: column; gap: 16px; align-items: flex-start; }

/* ================= 生成笔记 ================= */
.video-card { display: flex; gap: 12px; align-items: flex-start; background: var(--surface); border: 1px solid var(--hairline); border-radius: 6px; padding: 12px; }
.video-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.video-title { font-weight: 600; }
.video-meta { font-size: 0.857rem; color: var(--gray); }
.video-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 4px; }
.reading-row { display: flex; align-items: center; gap: 8px; color: var(--gray); padding: 8px 0; }
.spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--hairline); border-top-color: var(--gray); flex-shrink: 0; }
.def-row { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.def-k { font-size: 1rem; color: var(--gray); flex-shrink: 0; }
.def-v { font-weight: 600; min-width: 0; }
.ep-panel { border: 1px solid var(--hairline); border-radius: 6px; background: var(--surface); overflow: hidden; margin-top: 8px; }
.ep-head { padding: 8px 12px; font-size: 0.857rem; color: var(--gray); border-bottom: 1px solid var(--hairline); }
.ep-row { display: flex; align-items: center; gap: 12px; padding: 8px 12px; min-height: 2.286rem; }
.ep-row + .ep-row { border-top: 1px solid var(--hairline); }
.ep-row.selected { background: var(--accent-soft); }
.ep-num { color: var(--gray); font-size: 0.857rem; width: 28px; flex-shrink: 0; }
.ep-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ep-dur, .ep-tag { font-size: 0.857rem; color: var(--gray); flex-shrink: 0; white-space: nowrap; }
.panel-note { font-size: 0.857rem; color: var(--gray); margin-top: 8px; }

/* 底部计划卡：全页视觉权重最高的确认区 */
.plan-card {
  background: var(--surface); border: 1px solid var(--control-border);
  border-radius: 6px; padding: 16px; margin-top: 32px;
  box-shadow: 0 1px 2px rgba(16,24,40,.06);
  display: flex; flex-direction: column; gap: 12px;
}
.plan-label { font-size: 0.857rem; color: var(--gray); font-weight: 600; }
.plan-rows { display: flex; flex-direction: column; gap: 8px; }
.plan-row { display: flex; gap: 12px; }
.plan-k { width: 56px; flex-shrink: 0; color: var(--gray); font-size: 0.857rem; padding-top: 2px; }
.plan-v { flex: 1; min-width: 0; }
.plan-v .warn-text { color: var(--warn); font-weight: 600; }
.plan-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 4px; }
.plan-note { font-size: 0.857rem; color: var(--gray); }

/* 就地配置面板：覆盖层 + 面板对齐页面左边线（不单独居中） */
.modal-backdrop { position: fixed; inset: 0; background: rgba(28,32,38,.22); display: block; }
.modal {
  margin-left: calc(14.286rem + 24px); margin-top: 72px;
  width: 40rem; max-width: calc(100vw - 14.286rem - 48px);
  background: var(--surface); border-radius: 6px;
  box-shadow: 0 12px 32px rgba(16,24,40,.18);
  padding: 16px; display: flex; flex-direction: column; gap: 12px;
}
.modal-title { font-size: 1rem; font-weight: 600; }
.modal-note { font-size: 0.857rem; color: var(--gray); }
.form-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 4px; }

/* ================= 任务 ================= */
.task-group-label { font-size: 0.857rem; color: var(--gray); font-weight: 600; margin: 24px 0 8px; }
.task-group-label:first-child { margin-top: 0; }
.task-card { background: var(--surface); border: 1px solid var(--hairline); border-radius: 6px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.task-card + .task-card { margin-top: 8px; }
.task-card.dim { background: transparent; }
.task-card.dim .task-title { color: var(--gray); }
.task-head { display: flex; align-items: flex-start; gap: 8px; min-width: 0; }
.task-head .badge { margin-top: 1px; }
.task-title { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-top: 1px; }
.task-meta { font-size: 0.857rem; color: var(--gray); }
.work-list { display: flex; flex-direction: column; gap: 12px; border-top: 1px solid var(--hairline); padding-top: 12px; }
.work-item { display: flex; flex-direction: column; gap: 6px; }
.work-line { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.work-name { font-weight: 600; flex-shrink: 0; }
.work-stats { font-size: 0.857rem; color: var(--gray); flex: 1; min-width: 8rem; }
.bar { height: 6px; border-radius: 3px; background: var(--neutral-bg); overflow: hidden; }
.bar-fill { height: 100%; background: var(--progress-fill); border-radius: 3px; }
.milestone { font-size: 0.857rem; color: var(--gray); display: flex; gap: 6px; align-items: baseline; }

      + '<div class="pref-name" style="margin-bottom:4px">同时导出文件</div>'
      + '<div class="check-row"><span class="check">✓</span><div class="pref-main"><div class="pref-name" style="font-weight:400">Markdown 包</div><div class="pref-desc">在笔记软件中编辑，包含图片资源。</div></div></div>'
      + '<div class="check-row"><span class="check">✓</span><div class="pref-main"><div class="pref-name" style="font-weight:400">网页文件</div><div class="pref-desc">在浏览器中阅读和分享。</div></div></div>'
      + '<div class="check-row"><span class="check">✓</span><div class="pref-main"><div class="pref-name" style="font-weight:400">JSON 数据</div><div class="pref-desc">供程序处理，不含图片文件。</div></div></div>'
      + prefRow('保留在线下载的视频', '生成后保留下载的视频供离线播放，会占用额外空间。', false)
      + '</div>';
    return h + '</div>';
  }

  if (state === 'services') {
    h += '<div class="set-group"><div class="section-label">语音服务</div>'
      + svcRow('Deepgram', 'api.deepgram.com · 语音转录（/audio/transcriptions）· 模型 nova-3',

      + '<div class="set-group"><div class="section-label">AI 服务</div>'
      + svcRow('ux-fixture', '127.0.0.1 · 聊天补全（/chat/completions）· 模型 fixture-llm-01 · 尚未测试',
          '<span class="badge neutral">配置已保存</span>',
          '<button class="btn btn-quiet compact">测试服务</button><button class="btn btn-quiet compact">编辑</button>')
      /* 正在编辑的服务表单：两处字段错误 */
      + '<div class="svc-card editing">'
      + '<div class="svc-name">编辑 AI 服务 · ux-fixture</div>'
      + '<div class="banner">修改尚未启用；当前仍使用 127.0.0.1 · fixture-llm-01（版本 1）。</div>'
      + field('服务名称', inputEl('ux-fixture'))
      + field('接口类型', selectEl('聊天补全（/chat/completions）'))
      + field('服务地址', inputEl('127.0.0.1:8788', '', true), null, '请输入包含 http:// 或 https:// 的服务地址')
      + field('模型 ID', inputEl('fixture-llm-01'))
      + field('认证方式',
          '<div class="seg compact"><button class="seg-btn selected">API Key</button><button class="seg-btn">无需认证</button></div>')
      + field('API Key', inputEl('', '粘贴服务提供的 Key', true), null, '此认证方式需要 API Key')
      + '<div class="modal-note">测试会发送应用内置的测试内容，不包含你的课程；服务可能按其规则计费。</div>'
      + '<div class="form-actions"><button class="btn btn-quiet">取消</button>'
      + '<button class="btn btn-outline">测试服务</button>'
      + '<button class="btn btn-primary">保存服务</button></div>'
      + '</div>'
      + '<button class="btn btn-outline compact" style="margin-top:8px">添加 AI 服务</button></div>'
      + '<div class="set-group"><div class="section-label">Bilibili 账号</div>'
      + '<div class="svc-card"><div class="svc-head"><span class="svc-name">Bilibili：已登录 · 合成测试讲师</span>'
      + '<span class="svc-actions"><button class="btn btn-quiet compact">管理账号</button></span></div>'
      + '<div class="svc-sub">读取需要权限的视频时使用此登录。</div></div></div>';
    return h + '</div>';
  }

  if (state === 'storage') {
    h += '<div class="set-group"><div class="section-label">课程库</div>'
      + '<div class="svc-card"><div class="svc-head"><span class="svc-name">默认课程库</span>'
      + '<span class="badge neutral">默认保存位置</span>'
      + '<span class="svc-actions"><button class="btn btn-quiet compact">移动课程库</button></span></div>'
      + '<div class="svc-sub mono">~/Documents/course2md</div>'
      + '<div class="svc-sub">占用 1.8 GB · 笔记版本 1.1 GB · 离线视频 540 MB · 可继续任务 160 MB</div></div>'
      + '<div class="svc-card"><div class="svc-head"><span class="svc-name">归档课程库</span>'
      + '<span class="svc-actions"><button class="btn btn-quiet compact">设为默认保存位置</button>'
      + '<button class="btn btn-quiet compact">移动课程库</button></span></div>'
      + '<div class="svc-sub mono">/Volumes/ArchiveSSD/course2md</div>'
      + '<div class="svc-sub">占用 12.4 GB</div></div>'
      + '<div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">'
      + '<button class="btn btn-outline compact">添加已有课程库</button>'
      + '<button class="btn btn-outline compact">新建课程库</button></div></div>'
      + '<div class="set-group"><div class="section-label">模型与占用</div>'
      + '<div class="svc-card"><div class="svc-head"><span class="svc-name">本机识别模型 whisper-small</span>'
      + '<span class="svc-actions"><button class="btn btn-quiet compact">删除模型</button></span></div>'
      + '<div class="svc-sub">132 MB · 当前没有任务使用</div></div></div>'
      + disc('技术详情', '· 库 ID、索引版本与完整路径');
    return h + '</div>';
  }

  /* app */
  h += '<div class="set-group"><div class="section-label">外观与动效</div>'
    + prefRow('减少动态效果', '遵循系统偏好；开启后立即减少界面动效。', false)
    + '</div>'
    + '<div class="set-group"><div class="section-label">关于</div>'
    + '<div class="svc-card"><div class="svc-head"><span class="svc-name">course2md 1.7.0</span>'
    + '<span class="svc-sub mono">构建 6881a1bac0df</span>'
    + '<span class="svc-actions"><button class="btn btn-quiet compact">发送反馈</button>'
    + '<button class="btn btn-quiet compact">帮助</button></span></div></div></div>'
    + '<div class="set-group"><div class="section-label">诊断</div>'
    + '<div class="svc-card">'
    + '<div class="svc-sub">检查读取、识别与导出所需的工具和权限；结论就地显示，原始日志收在技术详情。</div>'
    + '<div class="diag-line"><span class="diag-ic diag-ok">✓</span><span>媒体读取与截图工具 ffmpeg 7.1.2 已就绪</span></div>'
    + '<div class="diag-line"><span class="diag-ic diag-ok">✓</span><span>本机识别运行时 apple-asr 0.4 已就绪</span></div>'
    + '<div class="diag-line"><span class="diag-ic diag-opt">○</span><span>在线下载工具 yt-dlp 未安装 — 只处理本地视频时不需要</span>'
    + '<button class="link-quiet">查看安装方法</button></div>'
    + '<div style="margin-top:8px"><button class="btn btn-outline compact">重新诊断</button></div>'
    + disc('技术详情', '· 模型文件路径与缺失文件清单')
    + '</div></div>';
  return h + '</div>';
}

/* ================= 初始化 ================= */
(function () {
  var q = new URLSearchParams(location.search);
  var scale = parseFloat(q.get('scale') || '1');
  if (!isFinite(scale) || scale <= 0) scale = 1;
  document.documentElement.style.setProperty('--scale', String(scale));
  var page = q.get('page') || 'library';
  var defaults = { library: 'grouped', generate: 'empty', tasks: 'running', reader: 'notes', settings: 'general' };
  var state = q.get('state') || defaults[page] || '';
  var from = q.get('from') || '';
  var renderers = { library: renderLibrary, generate: renderGenerate, tasks: renderTasks, reader: renderReader };
  var html = page === 'settings' ? renderSettings(state, from) : (renderers[page] || renderLibrary)(state);
  document.getElementById('main').innerHTML = html;
  /* 侧栏选中态：阅读归入课程库；任务徽章在未查看时显示（不在任务页自身） */
  var navSel = page === 'reader' ? 'library' : page;
  var navEl = document.querySelector('.nav-item[data-nav="' + navSel + '"]');
  if (navEl) navEl.classList.add('selected');
  if (page !== 'tasks') document.getElementById('taskBadge').style.display = '';
  /* 首次空态：还没有文件夹和未查看任务，侧栏只留主导航 */
  if (page === 'library' && state === 'empty') {
    document.querySelector('.group-header').style.display = 'none';
    document.querySelector('.folder-list').style.display = 'none';
    document.getElementById('taskBadge').style.display = 'none';
  }
  document.title = 'course2md mock · ' + page + '/' + state;
})();
</script>
